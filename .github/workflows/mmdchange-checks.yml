name: FoodOS games and production checks
on:
  pull_request:
  push:
    branches: [mmdchange]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodos_test
          POSTGRES_PASSWORD: foodos_test
          POSTGRES_DB: foodos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://foodos_test:foodos_test@localhost:5432/foodos_test
      TEST_DATABASE_URL: postgresql://foodos_test:foodos_test@localhost:5432/foodos_test
      CHECKPOINT_DISABLE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages && pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm --filter @restaurant-os/api exec jest --config jest.config.js --runInBand
      - run: pnpm --filter @restaurant-os/api exec jest --config jest.e2e.config.js --runInBand --runTestsByPath test/games.e2e-spec.ts test/loyalty.e2e-spec.ts test/foodos-features.e2e-spec.ts
      - run: pnpm -r typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/games-browser-smoke.cjs
      - run: docker build -f apps/api/Dockerfile -t foodos-api-test .
